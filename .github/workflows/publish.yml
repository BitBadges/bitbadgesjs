name: Publish to npm

# Publishes packages/bitbadgesjs-sdk to npm with npm trusted publishing (OIDC).
# No NPM_TOKEN is stored. The job waits for approval on the `npm-publish`
# environment before anything is published.
#
# Release flow: bump "version" in packages/bitbadgesjs-sdk/package.json on main,
# then push a matching tag (e.g. `git tag v0.45.11 && git push origin v0.45.11`)
# or publish a GitHub Release for that tag. Approve the deployment when asked.

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    defaults:
      run:
        working-directory: packages/bitbadgesjs-sdk
    steps:
      - name: Resolve tag
        id: tag
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then TAG="$RELEASE_TAG"; else TAG="$REF_NAME"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refuse if tag does not match package.json version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION; refusing to publish."
            exit 1
          fi
          if npm view "bitbadges@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::bitbadges@$PKG_VERSION is already on npm; refusing to publish."
            exit 1
          fi
          echo "Publishing bitbadges@$PKG_VERSION from $TAG"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publish
        run: npm publish --provenance --access public
