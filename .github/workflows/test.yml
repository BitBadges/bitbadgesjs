name: Run Tests

on:
  push:
    branches:
      - main # Adjust the branch name as needed
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/bitbadgesjs-sdk
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: packages/bitbadgesjs-sdk
        run: bun test scripts/related-repo.test.ts && bun run test

      - name: Build published artifacts
        working-directory: packages/bitbadgesjs-sdk
        run: bun run build

      - name: Check offline agent workflows against built artifacts
        working-directory: packages/bitbadgesjs-sdk
        run: bun run test:agent-contracts

      - name: Check CLI and MCP actions against local API fixtures
        working-directory: packages/bitbadgesjs-sdk
        run: bun run test:agent-workflows

      - name: Check golden builder constraints and adversarial mutations
        working-directory: packages/bitbadgesjs-sdk
        run: bun run test:agent-golden > agent-golden-report.json

      - name: Upload golden evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-golden-report
          path: packages/bitbadgesjs-sdk/agent-golden-report.json
          if-no-files-found: ignore

      - name: Benchmark static reviewer mutations and intentional configurations
        if: success() || failure()
        working-directory: packages/bitbadgesjs-sdk
        run: bun run test:agent-auditor > agent-auditor-report.json

      - name: Upload static review benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-auditor-report
          path: packages/bitbadgesjs-sdk/agent-auditor-report.json
          if-no-files-found: error
