name: Experimental golden builder evaluations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install and build SDK
        working-directory: packages/bitbadgesjs-sdk
        run: bun install --frozen-lockfile && bun run build
      - name: Check golden builder constraints and adversarial mutations
        working-directory: packages/bitbadgesjs-sdk
        run: bun run test:agent-golden > agent-golden-report.json

      - name: Upload golden evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-golden-report
          path: packages/bitbadgesjs-sdk/agent-golden-report.json
          if-no-files-found: error
